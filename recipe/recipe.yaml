context:
  name: "valkey"
  version: "6.2.0"

package:
  name: "valkey-py"
  version: "${{ version }}"

source:
  url: https://github.com/valkey-io/valkey-py/archive/refs/tags/v${{ version }}.zip
  sha256: 97c7a262463ca8140e301e17c1f1b76965e7096156396aca4afa6b9415455572

build:
  noarch: python
  number: 0
  script:
    env:
      PIP_USE_PEP517: "1"
    content:
      - "python -m pip install --no-build-isolation ."

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - async-timeout >=4.0.3

  # https://github.com/valkey-io/valkey-py/blob/v6.2.0/pyproject.toml#L70-L76
  run_constraints:
    - libvalkey-py >=4.0.1

    - "cryptography >=36.0.1"
    - "requests >=2.31.0"

    - "pyopenssl >=23.2.0"

tests:
  - python:
      imports:
        - valkey
      python_version: ${{ python_min }}.*

about:
  license: MIT
  license_file:
    - LICENSE
  summary: Valkey Python client based on a fork of redis-py
  homepage: https://github.com/valkey-io/valkey-py
  repository: https://github.com/valkey-io/valkey-py

extra:
  recipe-maintainers:
    - trim21
